name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the minimum the project supports; 3.12 is what current
        # SteamOS-era systems ship.
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      # For tests/test_ui_smoke.py, which builds every screen offscreen. If the
      # system libraries are missing the tests skip themselves (the reason is
      # printed in the summary), so this step is best effort.
      - name: Qt for the UI smoke test
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 || true
          pip install PyQt6

      - name: Lint (ruff)
        run: ruff check .

      - name: Byte-compile every module
        run: python -m compileall -q src tests

      - name: Tests
        run: pytest
        env:
          QT_QPA_PLATFORM: offscreen

  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # shellcheck is preinstalled on ubuntu-latest. Only errors fail the
      # build for now; the remaining warnings are being worked down.
      - name: shellcheck (errors)
        run: git ls-files -z '*.sh' | xargs -0 shellcheck --severity=error

      - name: Shell scripts use LF line endings
        run: |
          if git ls-files -z '*.sh' '*.desktop' | xargs -0 grep -l $'\r'; then
            echo "::error::CRLF line endings found in the files above"
            exit 1
          fi
